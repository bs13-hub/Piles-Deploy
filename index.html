<title>Piles · playable sketch</title>
<style>
  :root{
    --bg:#F7F6F2; --card:#FFFFFF; --ink:#1C1E21; --ink2:#5B6067; --ink3:#9AA0A8;
    --line:#E8E6E0; --accent:#0E7A6E; --accent-soft:#E3F1EE; --accent-ink:#0A5A51;
    --amber:#B45309; --amber-soft:#FBEEDD; --red:#B0322B; --red-soft:#F9E7E5;
    --violet:#5B5BD6; --violet-soft:#EBEBFA;
    --r:16px; --shadow:0 1px 2px rgba(20,22,25,.05), 0 4px 14px rgba(20,22,25,.06);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,sans-serif;
    height:100%;}
  body{display:flex; justify-content:center;}
  #frame{width:100%; max-width:460px; min-height:100dvh; position:relative; display:flex; flex-direction:column;}
  #app{flex:1; overflow-y:auto; padding:18px 16px 96px; -webkit-overflow-scrolling:touch;}
  h1{font-size:22px; margin:0; letter-spacing:-.02em;}
  .sub{color:var(--ink2); font-size:13px;}
  .muted{color:var(--ink3);}
  .row{display:flex; align-items:center; gap:8px;}
  .spread{display:flex; align-items:center; justify-content:space-between; gap:8px;}

  /* ---------- cards / blocks ---------- */
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--r);
    box-shadow:var(--shadow); padding:14px; margin-bottom:12px;}
  .block{cursor:pointer; transition:transform .08s ease;}
  .block:active{transform:scale(.985);}
  .block.done{opacity:.55;}
  .block.next{border:1.5px solid var(--accent); background:linear-gradient(180deg,#FFFFFF, #F4FBF9);}
  .block-time{font-size:12px; font-weight:600; color:var(--ink2); letter-spacing:.02em;}
  .block-name{font-size:17px; font-weight:700; margin:2px 0 6px; letter-spacing:-.01em;}
  .chipline{font-size:12.5px; color:var(--ink2);}
  .tag{display:inline-block; font-size:11px; font-weight:600; padding:3px 8px; border-radius:99px;}
  .tag.next{background:var(--accent-soft); color:var(--accent-ink);}
  .tag.donetag{background:#EFEEEA; color:var(--ink2);}
  .nowline{display:flex; align-items:center; gap:8px; margin:14px 2px; color:var(--red);}
  .nowline .dot{width:8px; height:8px; border-radius:99px; background:var(--red);}
  .nowline .ln{flex:1; height:1.5px; background:var(--red); opacity:.5;}
  .nowline span{font-size:11px; font-weight:700; letter-spacing:.04em;}

  /* ---------- capacity meter ---------- */
  .meter{height:8px; border-radius:99px; background:#ECEAE4; overflow:hidden; margin-top:8px;}
  .meter > i{display:block; height:100%; border-radius:99px; background:var(--accent); transition:width .25s ease;}
  .meter.warn > i{background:var(--amber);}
  .meter.over > i{background:var(--red);}
  .meter-label{font-size:12px; color:var(--ink2); margin-top:5px;}

  /* ---------- piles ---------- */
  .pile{border:1.5px dashed #D8D5CC; border-radius:var(--r); padding:12px; margin-bottom:12px; background:#FCFBF8;}
  .pile-name{font-size:13px; font-weight:700; color:var(--ink2); margin-bottom:8px; letter-spacing:.01em;}
  .chips{display:flex; flex-wrap:wrap; gap:7px;}
  .chip{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:7px 10px;
    font-size:13.5px; box-shadow:0 1px 2px rgba(20,22,25,.04); cursor:pointer; display:inline-flex; align-items:center; gap:6px;}
  .chip:active{transform:scale(.97);}
  .chip .m{font-size:11px; font-weight:700; color:var(--accent-ink); background:var(--accent-soft); padding:1.5px 6px; border-radius:99px;}
  .chip.deferred{opacity:.5;}
  .chip.picked{border-color:var(--accent); background:var(--accent-soft);}

  /* ---------- fill screen ---------- */
  .task-row{display:flex; align-items:center; gap:10px; padding:11px 4px; border-bottom:1px solid var(--line);}
  .task-row:last-child{border-bottom:none;}
  .task-row .name{flex:1; font-size:15px;}
  .task-row .est{font-size:12.5px; color:var(--ink2); font-variant-numeric:tabular-nums;}
  .task-row .learnedtag{font-size:10px; color:var(--violet); font-weight:700;}
  .addbtn{width:32px; height:32px; border-radius:99px; border:1.5px solid var(--line); background:#fff;
    font-size:18px; line-height:1; color:var(--accent-ink); cursor:pointer; flex-shrink:0;}
  .addbtn.on{background:var(--accent); border-color:var(--accent); color:#fff;}
  .banner{border-radius:12px; padding:11px 12px; font-size:13.5px; margin:10px 0; line-height:1.45;}
  .banner.over{background:var(--red-soft); color:var(--red);}
  .banner.info{background:var(--violet-soft); color:#3F3FA8;}
  .banner .bannerbtns{margin-top:8px; display:flex; gap:8px;}
  .order-row{display:flex; gap:10px; padding:9px 2px; align-items:flex-start;}
  .order-num{width:22px; height:22px; border-radius:99px; background:var(--accent-soft); color:var(--accent-ink);
    font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px;}
  .order-body .nm{font-size:14.5px; font-weight:600;}
  .order-body .why{font-size:12px; color:var(--ink2); margin-top:1px;}
  .order-body .par{font-size:11px; color:var(--violet); font-weight:600;}

  /* ---------- buttons ---------- */
  .btn{border:none; border-radius:14px; padding:13px 16px; font-size:15px; font-weight:700; cursor:pointer;
    font-family:inherit; letter-spacing:-.01em;}
  .btn:active{transform:scale(.98);}
  .btn.primary{background:var(--accent); color:#fff; width:100%;}
  .btn.ghost{background:transparent; color:var(--ink2); border:1.5px solid var(--line); width:100%;}
  .btn.small{padding:8px 12px; font-size:13px; border-radius:10px; width:auto;}
  .btn.violet{background:var(--violet); color:#fff;}

<body>
<div id="frame">
  <div id="app"></div>
  <div id="tabbar"></div>
  <div id="toast"></div>
</div>
<script>
"use strict";
/* =============== STATE =============== */
let uid = 1;
const T = (name, est, pile, opts={}) => ({id:"t"+(uid++), name, est, pile, energy:"low", where:"home", avoid:0, ...opts});

function defaultState(){
  const s = {
    clock: 18*60+10, // 6:10 PM simulated
    screen: {name:"today"},
    learned: {},
    deferred: {},
    tasks: [],
    piles: [
      {id:"dump",  name:"The Dump", loose:true},
      {id:"home",  name:"When I Get Home"},
      {id:"low",   name:"Low-Brain Tasks"},
      {id:"avoid", name:"Things I Keep Avoiding"},
      {id:"brain", name:"Needs a Brain"}
    ],
    sprints: [
      {id:"deep",  name:"Deep Work",   start:8*60,      end:10*60,     picked:[], plan:null, status:"done-earlier"},
      {id:"lunch", name:"Lunch Reset", start:12*60+30,  end:13*60,     picked:[], plan:null, status:"done-earlier"},
      {id:"house", name:"House Reset", start:18*60+15,  end:19*60,     picked:[], plan:null, status:"idle", homePile:"home"},
      {id:"wind",  name:"Wind Down",   start:20*60+30,  end:21*60,     picked:[], plan:null, status:"idle", homePile:"low"}
    ],
    calEvents: [ {id:"cal1", name:"Dinner", start:19*60, end:20*60} ],
    run: null,
    results: {},
    reviewed: {},
    dismissedCats: {},
    dismissedGaps: {},
    glitchUsed: false,
    introSeen: false
  };
  s.tasks = [
    T("Start laundry", 3, "home", {parallel:{runs:35}, where:"laundry"}),
    T("Dishes", 7, "home", {where:"kitchen"}),
    T("Take out trash", 4, "home", {batch:"outside", where:"outside"}),
    T("Check mailbox", 2, "home", {batch:"outside", where:"outside"}),
    T("Wipe counters", 5, "home", {where:"kitchen"}),
    T("Water plants", 4, "home"),
    T("Shower", 12, "home", {anchor:"end", where:"bath"}),
    T("Fold laundry", 10, "home", {needsDry:true}),
    T("Charge headphones", 1, "low"),
    T("Unsubscribe from 5 emails", 5, "low", {where:"phone"}),
    T("Queue tomorrow's podcast", 2, "low", {where:"phone"}),
    T("Call pharmacy", 6, "avoid", {deadline:"closes 7 PM", avoid:4, where:"phone"}),
    T("Schedule dentist", 5, "avoid", {avoid:6, window:[9*60,17*60], windowWhy:"office is closed at this hour", where:"phone"}),
    T("Plan tomorrow", 10, "brain", {energy:"high", where:"desk"}),
    T("Reply to Mom's text", 8, "brain", {energy:"med", where:"phone"})
  ];
  return s;
}

/* =============== PERSISTENCE =============== */
const STORE_KEY = "piles-proto-v13";
const store = (()=>{ try{ const t="__piles_t"; localStorage.setItem(t,"1"); localStorage.removeItem(t); return localStorage; }catch(e){ return null; } })();
function saveState(){
  if (!store) return;
  try{
    const {screen, run, ...rest} = state;
    store.setItem(STORE_KEY, JSON.stringify({v:13, uid, data:rest}));
  }catch(e){}
}
function loadState(){
  if (!store) return null;
  try{
    const raw = store.getItem(STORE_KEY); if (!raw) return null;
    const d = JSON.parse(raw); if (!d || d.v !== 13 || !d.data) return null;
    uid = d.uid || 500;
    const s = d.data;
    s.screen = {name:"today"}; s.run = null;
    s.dismissedCats = s.dismissedCats || {}; s.dismissedGaps = s.dismissedGaps || {};
    s.calEvents = s.calEvents || [];
    return s;
  }catch(e){ return null; }
}
let state = loadState() || defaultState();
let resetArmed = 0;
function resetDemo(){
  const now = Date.now();
  if (now - resetArmed > 5000){ resetArmed = now; toast("Tap again within 5 seconds to erase everything and restore the demo."); return; }
  if (store){ try{ store.removeItem(STORE_KEY); }catch(e){} }
  uid = 1; state = defaultState(); state.introSeen = true;
  render();
  toast("Fresh demo restored.");
}

/* hidden "reality" multipliers used to simulate actual durations */
const TRUTH = {
  "dishes":1.75, "wipe counters":1.3, "take out trash":0.8, "check mailbox":0.9,
  "shower":1.35, "start laundry":1.1, "move laundry to dryer":1.2, "water plants":0.8,
  "fold laundry":1.4, "plan tomorrow":1.5, "call pharmacy":1.15, "reply to mom's text":1.6
};
const keyOf = t => t.name.toLowerCase();
const learnedOf = t => state.learned[keyOf(t)];
const estOf = t => { const L = learnedOf(t); return L ? Math.max(1, Math.round(t.est * L.mult)) : t.est; };
const fmtClock = m => { let h=Math.floor(m/60), mm=m%60, ap=h>=12?"PM":"AM"; h=((h+11)%12)+1; return h+":"+String(mm).padStart(2,"0")+" "+ap; };
const fmtShort = m => fmtClock(m).replace(/ [AP]M/,"");
const escAttr = s => (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const fmtRange = s => fmtClock(s.start).replace(" "," ")+" – "+fmtClock(s.end).replace(" "," ");
const durOf = s => s.end - s.start;
const taskById = id => state.tasks.find(t=>t.id===id);
const pileTasks = pid => state.tasks.filter(t=>t.pile===pid && !t.doneToday && !state.deferred[t.id]);

/* =============== HELPERS =============== */
const $ = sel => document.querySelector(sel);
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
let toastTimer=null;
function toast(msg){ const el=$("#toast"); el.textContent=msg; el.style.opacity=1;
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.style.opacity=0, 2600); }
function go(name, arg){ state.screen={name, arg}; render(); $("#app").scrollTop=0; window.scrollTo(0,0); }

/* =============== PLANNING ENGINE =============== */
function score(t, sprint){
  let s = 0;
  if (t.deadline) s += 40;
  s += (t.avoid||0) * 6;
  const evening = sprint.start >= 17*60;
  if (evening) s += (t.energy==="low") ? 12 : (t.energy==="med") ? 6 : 0;
  else         s += (t.energy==="high") ? 10 : 6;
  if (t.pile === sprint.homePile) s += 15;
  if (t.parallel) s += 20;
  if (t.batch) s += 4;
  return s;
}

function eligibility(t, sprint, pickedIds){
  // returns {ok:true} or {ok:false, why}
  if (t.window && (state.clock < t.window[0] || state.clock > t.window[1]))
    return {ok:false, why:t.windowWhy || "outside its time window"};
  if (t.needsDry){
    const laundryPicked = pickedIds.some(id => taskById(id) && taskById(id).parallel);
    if (laundryPicked) return {ok:false, why:"the wash just started, it won't be dry before this session ends"};
    return {ok:false, why:"no dry laundry will be ready during this session"};
  }
  return {ok:true};
}

function suggestedFor(sprint){
  // all pile tasks, sorted by score, with eligibility computed
  const cands = state.tasks.filter(t => !t.doneToday && !state.deferred[t.id] && !t.autoCompanion);
  return cands.map(t => ({t, s:score(t,sprint), elig:eligibility(t, sprint, sprint.picked)}))
              .sort((a,b)=> b.s - a.s);
}

function plannedMinutes(sprint){
  return sprint.picked.reduce((sum,id)=>{ const t=taskById(id); return sum + (t?estOf(t):0); }, 0);
}

function ensureCompanions(sprint){
  // Start laundry picked -> auto-add "Move laundry to dryer" if it fits the sprint length
  const laundry = sprint.picked.map(taskById).find(t=>t && t.parallel);
  let comp = state.tasks.find(t=>t.autoCompanion);
  if (laundry && durOf(sprint) >= laundry.parallel.runs + 5){
    if (!comp){
      comp = T("Move laundry to dryer", 2, "home", {autoCompanion:true, after:laundry.id, where:"laundry"});
      state.tasks.push(comp);
    }
    if (!sprint.picked.includes(comp.id)) sprint.picked.push(comp.id);
  } else if (comp){
    sprint.picked = sprint.picked.filter(id=>id!==comp.id);
  }
}

function bufferFor(cap){ return Math.min(7, Math.max(5, Math.round(cap * 0.14))); }
function companionEstimate(){
  const comp = state.tasks.find(t=>t.autoCompanion);
  if (comp) return estOf(comp);
  const L = state.learned["move laundry to dryer"];
  return L ? Math.max(1, Math.round(2 * L.mult)) : 2;
}
function autofill(sprint){
  sprint.picked = [];
  const cap = durOf(sprint);
  const buffer = bufferFor(cap);
  const target = cap - buffer;
  const leftFit = [];
  const sugg = suggestedFor(sprint);
  let used = 0;
  for (const {t, elig} of sugg){
    if (t.pile !== sprint.homePile) continue; // context first: only this sprint's pile auto-fills
    if (!elig.ok) continue; // blocked tasks are explained live in the fill screen
    const companionCost = (t.parallel && cap >= t.parallel.runs + 5) ? companionEstimate() : 0;
    const d = estOf(t) + companionCost;
    if (used + d <= target){ sprint.picked.push(t.id); used += d; }
    else leftFit.push({t, why:"didn't fit: " + d + "m needed, " + Math.max(0,target-used) + "m left after the " + buffer + "m transition buffer"});
  }
  ensureCompanions(sprint);
  sprint.plan = sequencePlan(sprint);
  // if the washer forces a wait, try to fill the wait with small eligible pile tasks (within cap)
  let guard = 0;
  while (guard++ < 3){
    const w = sprint.plan.wait;
    if (!w || w.mins < 1) break;
    const total = plannedMinutes(sprint);
    const idx = leftFit.findIndex(x => estOf(x.t) <= w.mins && total + estOf(x.t) <= cap);
    if (idx < 0) break;
    sprint.picked.push(leftFit[idx].t.id);
    leftFit.splice(idx, 1);
    sprint.plan = sequencePlan(sprint);
  }
  sprint.leftFit = leftFit;
  sprint.buffer = buffer;
  sprint.status = "planned";
}

function sequencePlan(sprint){
  const tasks = sprint.picked.map(taskById).filter(Boolean);
  const why = {};
  let pool = [...tasks];

  const starters = pool.filter(t=>t.parallel);          pool = pool.filter(t=>!t.parallel);
  const outside  = pool.filter(t=>t.batch==="outside"); pool = pool.filter(t=>t.batch!=="outside");
  const anchors  = pool.filter(t=>t.anchor==="end");    pool = pool.filter(t=>t.anchor!=="end");
  const gated    = pool.filter(t=>t.after);             pool = pool.filter(t=>!t.after);
  pool.sort((a,b)=>estOf(a)-estOf(b));

  const base = [...starters, ...outside, ...pool, ...anchors];
  starters.forEach(t=>{ why[t.id] = "First, because the machine runs while you do everything else."; });
  outside.forEach((t,i)=>{ why[t.id] = i===0 ? "Batched: one trip outside covers everything out there." : "You're already outside."; });
  pool.forEach(t=>{ why[t.id] = estOf(t)<=3 ? "Quick win, keeps the momentum up." : "Main block of the session."; });
  anchors.forEach(t=>{ why[t.id] = "Last on purpose: it ends the session clean, and nothing after needs you."; });

  // place each gated task at the earliest slot where the machine is actually done
  gated.forEach(g=>{
    const parent = taskById(g.after);
    const ready = (parent ? estOf(parent) : 0) + ((parent && parent.parallel) ? parent.parallel.runs : 35);
    let cum = 0, idx = base.length;
    for (let i = 0; i < base.length; i++){
      if (cum >= ready){ idx = i; break; }
      cum += estOf(base[i]);
    }
    base.splice(idx, 0, g);
    g._ready = ready;
  });

  // real timeline: compute start minutes, inserting an explicit wait if the washer isn't done
  const times = {};
  let wait = null, cum = 0;
  base.forEach(t=>{
    if (t.after && t._ready !== undefined && cum < t._ready){
      wait = {beforeId: t.id, mins: Math.ceil(t._ready - cum)};
      cum = t._ready;
    }
    times[t.id] = Math.round(cum);
    cum += estOf(t);
  });
  gated.forEach(g=>{
    const s = times[g.id];
    if (wait && wait.beforeId === g.id)
      why[g.id] = "Washer runs until ~minute " + g._ready + ". Short wait, then transfer.";
    else
      why[g.id] = "Washer is done around minute " + g._ready + "; you get here at ~minute " + s + ".";
    const gi = base.indexOf(g);
    const before = base[gi - 1];
    if (before && before.anchor === "end")
      why[before.id] = "Ends the working part of the session; only the dryer handoff comes after.";
  });

  return {seq: base.map(t=>t.id), why, times, wait};
}

/* =============== SIMULATED "ACTUALS" + LEARNING =============== */
function simActual(t){
  if (!state.glitchUsed && keyOf(t)==="wipe counters"){ state.glitchUsed = true; return 26; } // demo: timer left running once
  const truth = TRUTH[keyOf(t)] || 1.15;
  const noise = 0.92 + Math.random()*0.18;
  return Math.max(0.5, Math.round(t.est * truth * noise * 2) / 2);
}
function learn(t, actualMin){
  const k = keyOf(t);
  const ratio = actualMin / t.est;
  const L = state.learned[k];
  if (!L) state.learned[k] = {mult: ratio, n: 1};
  else { L.mult = L.mult*0.6 + ratio*0.4; L.n++; }
}

/* =============== RENDER: SHELL =============== */
function render(){
  const s = state.screen;
  const frame = $("#frame");
  frame.classList.toggle("exec-bg", s.name==="execute");
  $("#tabbar").style.display = (s.name==="today" || s.name==="piles") ? "flex" : "none";
  if (s.name==="today")   renderToday();
  if (s.name==="piles")   renderPiles();
  if (s.name==="fill")    renderFill(s.arg);
  if (s.name==="execute") renderExecute();
  if (s.name==="recap")   renderRecap(s.arg);
  renderTabbar();
  if (!state.introSeen) renderIntro();
  saveState();
}
function renderTabbar(){
  $("#tabbar").innerHTML =
    '<button class="'+(state.screen.name==="today"?"on":"")+'" onclick="go(\'today\')"><span class="ic">☀️</span>Today</button>' +
    '<button class="'+(state.screen.name==="piles"?"on":"")+'" onclick="go(\'piles\')"><span class="ic">🧺</span>Piles</button>';
}
function renderIntro(){
  const d = document.createElement("div");
  d.className = "overlay"; d.id = "intro";
  d.innerHTML = '<div class="inner fadein">' +
    '<h2>Piles</h2><div class="sub" style="margin-bottom:14px">a playable sketch · your changes now persist in this browser</div>' +
    '<div class="step"><div class="n">1</div><p><b>Dump tasks in.</b> Everything lands in The Dump. No projects, no tags, no filing. Make your own piles when it helps, or never.</p></div>' +
    '<div class="step"><div class="n">2</div><p><b>What kind of time do you want help using?</b> House Reset is an example session. Create your own with a name, a length, and the pile it draws from.</p></div>' +
    '<div class="step"><div class="n">3</div><p><b>Run it one task at a time.</b> It learns your real speeds, with your review, and plans better next time. Fast-forward skips the chores.</p></div>' +

/* =============== CALENDAR GAPS (SIMULATED) =============== */
let currentGap = null;
function recommendForGap(start, end){
  const dur = end - start, buffer = bufferFor(dur), target = dur - buffer;
  const pseudo = {start, end, picked:[]};
  let best = null;
  state.piles.forEach(p=>{
    const ts = state.tasks.filter(t=>t.pile===p.id && !t.doneToday && !state.deferred[t.id] && !t.autoCompanion && !t.parallel && !t.needsDry)
      .filter(t=>eligibility(t, pseudo, []).ok)
      .sort((a,b)=>estOf(a)-estOf(b));
    let used = 0; const fit = [];
    ts.forEach(t=>{ const d = estOf(t); if (used + d <= target){ fit.push(t); used += d; } });
    if (fit.length >= 2 && (!best || used > best.used)) best = {pile:p, fit, used, target, buffer};
  });
  if (!best) return null;
  best.why = best.fit.length+" of its tasks fit realistically: ~"+best.used+" of "+best.target+" usable minutes, "+best.buffer+" kept for transitions.";
  return best;
}
function findGapSuggestion(){
  currentGap = null;
  const busy = [];
  state.sprints.forEach(s=>busy.push({s:s.start, e:s.end, name:s.name}));
  (state.calEvents||[]).forEach(ev=>busy.push({s:ev.start, e:ev.end, name:ev.name}));
  busy.sort((a,b)=>a.s-b.s);
  let cur = Math.ceil(state.clock/5)*5, curName = null;
  const consider = (gs, ge, afterName)=>{
    if (ge - gs < 25) return null;
    const key = gs+"-"+ge;
    if (state.dismissedGaps[key]) return null;
    const rec = recommendForGap(gs, ge);
    if (!rec) return null;
    return {start:gs, end:ge, key, rec, afterName};
  };
  for (const b of busy){
    if (b.s > cur){
      const g = consider(cur, b.s, curName);
      if (g){ currentGap = g; return g; }
    }
    if (b.e > cur){ cur = b.e; curName = b.name; }
  }
  if (cur < 21*60){
    const g = consider(cur, Math.min(cur + 60, 22*60), curName);
    if (g){ currentGap = g; return g; }
  }
  return null;
}
function acceptGap(){
  const g = currentGap; if (!g) return;
  const sp = {id:"s"+(uid++), name:g.rec.pile.name+" session", start:g.start, end:g.end,
    picked:[], plan:null, status:"idle", homePile:g.rec.pile.id, custom:true};
  state.sprints.push(sp);
  autofill(sp);
  sp.changeTitle = "SUGGESTED FOR AN OPEN WINDOW";
  sp.changeNotes = ["Built for the free "+fmtShort(g.start)+" – "+fmtShort(g.end)+" window"+(g.afterName?" after "+g.afterName:"")+".",
    "Nothing is scheduled or started until you decide. Edit or delete freely."];
  state.dismissedGaps[g.key] = true;
  go("fill", sp.id);
  toast("Drafted for your review.");
}
function declineGap(){
  const g = currentGap; if (!g) return;
  state.dismissedGaps[g.key] = true;
  render();
  toast("Ignored. This window won't be suggested again.");
}

const SUGGEST_CATS = [
  {key:"work", name:"Work Follow-ups", label:"work follow-ups", words:["email","follow","review","send","report","deck","meeting","slack","client","invoice","draft","prep","sync","pipeline","tracker","standup"]},
  {key:"errands", name:"Errands", label:"errands", words:["buy","pick up","return","grocery","groceries","pharmacy","bank","post office","drop off","costco","store run"]},

  {key:"admin", name:"Life Admin", label:"life admin", words:["pay","bill","renew","insurance","form","tax","cancel","subscription","appointment","dmv","register"]}
];
function catMatches(cat, t){ const n = t.name.toLowerCase(); return cat.words.some(w=>n.includes(w)); }
function dumpSuggestion(){
  const dump = state.tasks.filter(t=>t.pile==="dump" && !t.doneToday && !t.autoCompanion);
  let best = null;
  SUGGEST_CATS.forEach(cat=>{
    if (state.dismissedCats[cat.key]) return;
    const hits = dump.filter(t=>catMatches(cat, t));
    if (hits.length >= 3 && (!best || hits.length > best.hits.length)) best = {cat, hits};
  });
  return best;
}

  const cat = SUGGEST_CATS.find(c=>c.key===key); if (!cat) return;
  const el = $("#sugname");
  const name = (((el&&el.value) || (suggUI.name!==undefined?suggUI.name:cat.name)) || cat.name).trim() || cat.name;
  const dump = state.tasks.filter(t=>t.pile==="dump" && !t.doneToday && !t.autoCompanion);
  const hits = dump.filter(t=>catMatches(cat, t) && !suggUI.removed[t.id]);

  const pid = createPile(name);

  state.dismissedCats[key] = true;
  suggUI = {open:false, removed:{}};
  render();

}

const EST_KEYWORDS = [ [/laundry/,3],[/dish/,7],[/trash|garbage/,4],[/mail/,2],[/shower/,12],[/counter/,5],
  [/plant/,4],[/vacuum/,15],[/sweep/,8],[/email/,5],[/call/,6],[/text|reply/,4],[/clean/,10],[/fold/,10] ];

function openTaskSheet(id){
  const t = taskById(id); if (!t) return;
  const scrim = document.createElement("div");
  scrim.className = "scrim"; scrim.id = "sheet";
  scrim.onclick = e=>{ if(e.target===scrim) scrim.remove(); };
  scrim.innerHTML = '<div class="sheet fadein"><h3>'+esc(t.name)+'</h3>' +
    '<div class="sub">'+(learnedOf(t) ? "Learned estimate, based on your actual times." : "Rough estimate. It will learn your real speed.")+'</div>' +
    '<div class="stepper"><button onclick="bumpEst(\''+id+'\',-1)">−</button>' +
    '<input class="valinput" id="estval" type="number" inputmode="numeric" min="1" max="240" value="'+estOf(t)+'" ' +
      'onchange="setEstInput(\''+id+'\', this.value)"> <span class="sub">min</span>' +
    '<button onclick="bumpEst(\''+id+'\',1)">+</button></div>' +
    '<div class="sub" style="margin-bottom:4px">Pile</div><div class="pilepick">' +
    state.piles.map(p=>'<div class="pp '+(t.pile===p.id?"on":"")+'" onclick="movePile(\''+id+'\',\''+p.id+'\')">'+esc(p.name)+'</div>').join("") +
    '</div><div class="btnrow"><button class="btn subtle" style="flex:1" onclick="deleteTask(\''+id+'\')">Delete</button>' +
    '<button class="btn primary" style="flex:1" onclick="closeSheet()">Done</button></div></div>';
  document.body.appendChild(scrim);
}
function closeSheet(){ const el=$("#sheet"); if(el) el.remove(); render(); }
function bumpEst(id, d){
  const t = taskById(id);
  const next = Math.max(1, estOf(t) + d);
  t.est = next; delete state.learned[keyOf(t)];
  const el = $("#estval"); if (el) el.value = next;
  saveState();
}
function setEstInput(id, v){
  const t = taskById(id); if (!t) return;
  const n = Math.min(240, Math.max(1, parseInt(v, 10) || t.est));
  t.est = n; delete state.learned[keyOf(t)];
  const el = $("#estval"); if (el) el.value = n;
  saveState();
}
function movePile(id, pid){ taskById(id).pile = pid; closeSheet(); openTaskSheet(id); }
function deleteTask(id){ state.tasks = state.tasks.filter(t=>t.id!==id);
  state.sprints.forEach(sp=>sp.picked = sp.picked.filter(x=>x!==id)); closeSheet(); }

/* =============== RENDER: FILL =============== */
function pileName(pid){ const p = state.piles.find(x=>x.id===pid); return p ? p.name : pid; }
function renderFill(spId){
  const sp = state.sprints.find(s=>s.id===spId);
  const cap = durOf(sp), filled = plannedMinutes(sp), over = filled - cap;
  const buffer = sp.buffer || bufferFor(cap);
  const target = cap - buffer;
  const pct = Math.min(100, Math.round(filled/cap*100));
  const meterCls = over>0 ? "over" : (filled>target ? "warn" : "");

  let html = '<button class="backlink" onclick="go(\'today\')">‹ Today</button>' +
    '<div class="spread"><div><h1>'+esc(sp.name)+'</h1><div class="sub">'+fmtRange(sp)+' · '+cap+' minutes · draws from '+esc(pileName(sp.homePile||"dump"))+'</div></div>' +
    '<button class="btn small subtle" onclick="openSessionSheet(\''+sp.id+'\')">Edit</button></div>';

  if (sp.changeNotes && sp.changeNotes.length){
    html += '<div class="learnbox" style="margin:12px 0 0"><div class="ttl">'+(sp.changeTitle||'WHAT CHANGED SINCE LAST RUN')+'</div>' +
      sp.changeNotes.map(n=>'<div class="ln">'+esc(n)+'</div>').join("") + '</div>';
  }

  html += '<div class="card" style="margin-top:12px"><div class="spread"><b style="font-size:14px">Capacity</b>' +
    '<span class="sub">'+filled+' / '+cap+' min</span></div>' +
    '<div class="meter '+meterCls+'" style="position:relative"><i style="width:'+pct+'%"></i>' +
    '<span style="position:absolute;top:0;bottom:0;width:1.5px;background:var(--amber);opacity:.75;left:'+Math.round(target/cap*100)+'%"></span></div>';

  if (over > 0){
    const victim = overflowVictim(sp, over);
    html += '<div class="banner over">This session is <b>'+over+' minute'+(over===1?"":"s")+' over</b>. That plan is fantasy.' +
      (victim ? '<div class="bannerbtns"><button class="btn small subtle" onclick="fixOverflow(\''+sp.id+'\')">Move “'+esc(victim.name)+'” to tomorrow</button></div>' : '') +
      '</div>';
  } else if (filled > target){
    html += '<div class="meter-label" style="color:var(--amber)">Into the '+buffer+'-minute transition buffer. Doable, but tight.</div>';
  } else if (filled > 0){
    html += '<div class="meter-label">'+(target-filled)+' min open · '+buffer+' min kept for transitions.</div>';
  } else {
    html += '<div class="meter-label">'+target+' min usable · '+buffer+' min kept for transitions.</div>';
  }
  html += '</div>';

  html += '<button class="btn violet" style="width:100%" onclick="doAutofill(\''+sp.id+'\')">✨ Build this session for me</button>';

  // urgent exceptions from other piles: offered, never auto-added
  const allSugg = suggestedFor(sp).filter(x=>!sp.picked.includes(x.t.id));
  sp.urgentDismissed = sp.urgentDismissed || {};
  const urgent = allSugg.filter(x=>x.elig.ok && x.t.deadline && x.t.pile!==sp.homePile && !sp.urgentDismissed[x.t.id]);
  urgent.forEach(({t})=>{
    html += '<div class="banner" style="background:var(--amber-soft);color:var(--amber)"><b>Urgent exception:</b> “'+esc(t.name)+'” ('+estOf(t)+'m) '+esc(t.deadline)+'. It lives in '+esc(pileName(t.pile))+', not this session. Pull it in?' +
      '<div class="bannerbtns"><button class="btn small subtle" onclick="toggleTask(\''+sp.id+'\',\''+t.id+'\')">Add it</button>' +
      '<button class="btn small subtle" onclick="dismissUrgent(\''+sp.id+'\',\''+t.id+'\')">Leave it</button></div></div>';
  });

  if (sp.picked.length){
    if (!sp.plan) sp.plan = sequencePlan(sp);
    html += '<div class="section-ttl">THE PLAN · IN ORDER</div><div class="card">';
    sp.plan.seq.forEach((id, i)=>{
      const t = taskById(id); if (!t) return;
      const L = learnedOf(t);
      const w = sp.plan.wait;
      if (w && w.beforeId === id){
        html += '<div class="order-row"><div class="order-num" style="background:#EFEEEA;color:var(--ink2)">⏳</div>' +
          '<div class="order-body" style="flex:1"><div class="nm" style="color:var(--ink2)">Wait ~'+w.mins+' min</div>' +
          '<div class="why">Washer still running.'+(w.mins>=4?' Room to slot a quick task from your piles.':'')+'</div></div></div>';
      }
      const startClock = sp.plan.times ? fmtClock(sp.start + (sp.plan.times[id]||0)).replace(/ [AP]M/,"") : "";
      html += '<div class="order-row"><div class="order-num">'+(i+1)+'</div><div class="order-body" style="flex:1">' +
        '<div class="spread"><span class="nm">'+esc(t.name)+'</span><span class="est">'+estOf(t)+'m'+(L?'<span class="learnedtag"> learned</span>':'')+(startClock?' · '+startClock:'')+'</span></div>' +
        '<div class="why">'+esc(sp.plan.why[id]||"")+'</div>' +
        (t.parallel ? '<div class="par">⟳ runs '+t.parallel.runs+' min in parallel</div>' : '') +
        '</div><button class="addbtn on" title="remove" onclick="event.stopPropagation();toggleTask(\''+sp.id+'\',\''+id+'\')">✓</button></div>';
    });
    html += '</div><button class="btn primary" onclick="startRun(\''+sp.id+'\')">▶ Start session</button>';
  }

  const fits = allSugg.filter(x=>x.elig.ok && !(x.t.deadline && x.t.pile!==sp.homePile));
  const blocked = allSugg.filter(x=>!x.elig.ok);
  const fitsHome = fits.filter(x=>x.t.pile===sp.homePile);
  const fitsOther = fits.filter(x=>x.t.pile!==sp.homePile);
  const rowFor = ({t})=>{
    const L = learnedOf(t);
    const d = estOf(t);
    const note = filled + d > cap ? ' · won’t fit' : (filled + d > target ? ' · tight' : '');
    return '<div class="task-row" onclick="toggleTask(\''+sp.id+'\',\''+t.id+'\')">' +
      '<button class="addbtn">+</button><span class="name">'+esc(t.name)+
      (t.avoid>=4 ? ' <span class="tag" style="font-size:10px;background:var(--amber-soft);color:var(--amber)">avoided ×'+t.avoid+'</span>':'') +
      (t.pile!==sp.homePile ? ' <span class="sub muted" style="font-size:11px">'+esc(pileName(t.pile))+'</span>':'') +
      '</span><span class="est">'+d+'m'+(L?'<span class="learnedtag"> learned</span>':'')+note+'</span></div>';
  };
  if (fitsHome.length){
    html += '<div class="section-ttl">FROM '+esc(pileName(sp.homePile)).toUpperCase()+'</div><div class="card">' + fitsHome.map(rowFor).join("") + '</div>';
  }
  if (fitsOther.length){
    html += '<div class="section-ttl">ELSEWHERE · ADD ON PURPOSE</div><div class="card">' + fitsOther.map(rowFor).join("") + '</div>';
  }
  if (blocked.length || (sp.leftFit||[]).length){
    html += '<div class="section-ttl">LEFT OUT, ON PURPOSE</div><div class="card">';
    const listed = new Set();
    blocked.forEach(({t, elig})=>{ listed.add(t.id);
      html += '<div class="leftout"><b>'+esc(t.name)+'</b> · '+esc(elig.why)+'</div>'; });
    (sp.leftFit||[]).forEach(({t, why})=>{ if (listed.has(t.id) || sp.picked.includes(t.id)) return;
      html += '<div class="leftout"><b>'+esc(t.name)+'</b> · '+esc(why)+'</div>'; });
    html += '</div>';
  }
  $("#app").innerHTML = html;
}
function dismissUrgent(spId, taskId){
  const sp = state.sprints.find(s=>s.id===spId);
  sp.urgentDismissed = sp.urgentDismissed || {};
  sp.urgentDismissed[taskId] = true;
  render();
  toast("Left in its pile. It will keep its deadline flag.");
}
function doAutofill(spId){
  const sp = state.sprints.find(s=>s.id===spId);
  sp.changeNotes = null; sp.changeTitle = null;
  autofill(sp);
  render();
  toast("Planned "+plannedMinutes(sp)+" of "+durOf(sp)+" min, "+sp.buffer+" min saved for transitions.");
}
function toggleTask(spId, taskId){
  const sp = state.sprints.find(s=>s.id===spId);
  const t = taskById(taskId);
  if (sp.picked.includes(taskId)){
    sp.picked = sp.picked.filter(id=>id!==taskId);
  } else {
    if (t.needsDry){
      const el = eligibility(t, sp, sp.picked);
      toast("Heads up: "+el.why+". Adding it anyway.");
    }
    sp.picked.push(taskId);
  }
  ensureCompanions(sp);
  sp.plan = sp.picked.length ? sequencePlan(sp) : null;
  render();
}
function overflowVictim(sp, over){
  // lowest-score removable task, prefer one big enough to fix the overflow
  const cands = sp.picked.map(taskById).filter(t=>t && !t.autoCompanion && !t.parallel)
    .map(t=>({t, s:score(t,sp), d:estOf(t)}))
    .sort((a,b)=> a.s - b.s);
  const fixer = cands.find(c=>c.d >= over);
  return (fixer || cands[0] || {}).t || null;
}
function fixOverflow(spId){
  const sp = state.sprints.find(s=>s.id===spId);
  const over = plannedMinutes(sp) - durOf(sp);
  const v = overflowVictim(sp, over);
  if (!v) return;
  sp.picked = sp.picked.filter(id=>id!==v.id);
  state.deferred[v.id] = true;
  ensureCompanions(sp);
  sp.plan = sp.picked.length ? sequencePlan(sp) : null;
  render();
  toast('“'+v.name+'” moved to tomorrow. Still in its pile, just resting.');
}

/* =============== EXECUTE =============== */
let tickHandle = null;
function startRun(spId){
  const sp = state.sprints.find(s=>s.id===spId);
  if (!sp.picked.length) return;
  sp.plan = sequencePlan(sp);
  state.run = {
    spId, queue: [...sp.plan.seq], i: 0, results: [],
    taskStart: Date.now(), sprintLeft: durOf(sp)*60, washerLeft: null
  };
  go("execute");
  clearInterval(tickHandle);
  tickHandle = setInterval(tick, 500);
}
function tick(){
  const r = state.run; if (!r || state.screen.name!=="execute") return;
  r.sprintLeft = Math.max(0, r.sprintLeft - 0.5);
  if (r.washerLeft !== null) r.washerLeft = Math.max(0, r.washerLeft - 0.5);
  const el = $("#elapsed"); if (el) el.textContent = fmtMMSS((Date.now()-r.taskStart)/1000) + " elapsed";
  const sr = $("#sprintrem"); if (sr) sr.textContent = fmtMMSS(r.sprintLeft) + " left";
  const w = $("#washer");
  if (w){ if (r.washerLeft === null) w.style.display="none";
    else { w.style.display="inline-block"; w.textContent = r.washerLeft<=0 ? "🧺 washer done" : "🧺 washer · "+fmtMMSS(r.washerLeft); } }
  const wn = $("#waitnote");
  if (wn && r.washerLeft !== null)
    wn.textContent = r.washerLeft > 0 ? "Washer still running · "+fmtMMSS(r.washerLeft)+" left. In real use this step would hold." : "Washer done. Go ahead.";
}
const fmtMMSS = s => Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0");
function renderExecute(){
  const r = state.run;
  const sp = state.sprints.find(s=>s.id===r.spId);
  const t = taskById(r.queue[r.i]);
  const upNext = r.queue.slice(r.i+1).map(taskById).filter(Boolean);
  const L = t ? learnedOf(t) : null;
  let html = '<div class="exec fadein"><div class="top"><span>'+esc(sp.name).toUpperCase()+'</span>' +
    '<span class="remaining" id="sprintrem">'+fmtMMSS(r.sprintLeft)+' left</span></div>' +
    '<span class="washer" id="washer" style="display:'+(r.washerLeft!==null?"inline-block":"none")+'">🧺 washer · '+(r.washerLeft!==null?fmtMMSS(r.washerLeft):"")+'</span>';
  if (t){
    html += '<div class="center checkanim"><div class="nowlabel">NOW · '+(r.i+1)+' OF '+r.queue.length+'</div>' +
      '<div class="taskname">'+esc(t.name)+'</div>' +
      '<div class="estline">estimated '+estOf(t)+' min'+(L?' · learned from you':'')+'</div>' +
      '<div class="elapsed" id="elapsed">0:00 elapsed</div>' +
      '<div class="why2">'+esc(sp.plan.why[t.id]||"")+'</div>' +
      (t.after ? '<div class="why2" id="waitnote" style="color:#E8B36A"></div>' : '') + '</div>' +
      '<div class="actions"><button class="btn done-btn" onclick="finishTask(\'done\')">Done ✓</button></div>' +
      '<div class="actions"><button class="btn dim" onclick="finishTask(\'skipped\')">Skip</button>' +
      '<button class="btn dim" onclick="finishTask(\'not-today\')">Not today</button></div>';
    if (upNext.length){
      html += '<div class="upnext"><div class="ttl">UP NEXT</div>' +
        upNext.slice(0,4).map(u=>'<div class="un-row"><span>'+esc(u.name)+'</span><span>'+estOf(u)+'m</span></div>').join("") +
        (upNext.length>4 ? '<div class="un-row muted"><span>+'+(upNext.length-4)+' more</span></div>' : '') + '</div>';
    }
    html += '<div class="ffwd"><button onclick="fastForward()">⏩ Fast-forward: simulate doing the rest</button></div>';
  }
  html += '</div>';
  $("#app").innerHTML = html;
}
function finishTask(outcome, simulated){
  const r = state.run;
  const t = taskById(r.queue[r.i]);
  if (!t){ endRun(); return; }
  if (outcome === "done"){
    const elapsedMin = (Date.now() - r.taskStart) / 60000;
    const quickTap = elapsedMin < 0.33; // tapped through: use a realistic simulated duration
    const actual = (simulated || quickTap) ? simActual(t) : Math.round(elapsedMin*2)/2;
    r.results.push({id:t.id, name:t.name, base:t.est, est:estOf(t), actual, outcome:"done", simulated: !!(simulated||quickTap)});
    t.doneToday = true; // learning is deferred to the recap review, after the times are checked
    if (t.parallel) r.washerLeft = t.parallel.runs * 60;
  } else if (outcome === "skipped"){
    r.results.push({id:t.id, name:t.name, base:t.est, est:estOf(t), actual:null, outcome:"skipped"});
  } else {
    r.results.push({id:t.id, name:t.name, base:t.est, est:estOf(t), actual:null, outcome:"not-today"});
    state.deferred[t.id] = true;
  }
  r.i++; r.taskStart = Date.now();
  if (r.i >= r.queue.length) endRun(); else renderExecute();
}
function fastForward(){
  const r = state.run;
  const step = ()=>{
    if (!state.run || r.i >= r.queue.length) return;
    finishTask("done", true);
    if (state.run && r.i < r.queue.length) setTimeout(step, 420);
  };
  toast("Simulating the rest of the session…");
  step();
}
function endRun(){
  const r = state.run;
  const sp = state.sprints.find(s=>s.id===r.spId);
  clearInterval(tickHandle);
  r.results.forEach(x=>{
    if (x.outcome !== "done") return;
    x.edited = x.actual;
    x.excluded = false;
    x.flag = (x.actual / x.est >= 2.0) || (x.actual - x.est >= 12);
    x.flagResolved = false;
  });
  state.results[sp.id] = r.results;
  state.reviewed[sp.id] = false;
  sp.status = "complete";
  state.run = null;
  go("recap", sp.id);
}

/* =============== RECAP: REVIEW PHASE =============== */
const fmtMin = v => (v % 1 ? v.toFixed(1) : v) + "m";
function prospectiveEst(x){
  const t = taskById(x.id); if (!t) return x.est;
  const L = state.learned[keyOf(t)];
  const ratio = x.edited / x.base;
  const m = L ? L.mult*0.6 + ratio*0.4 : ratio;
  return Math.max(1, Math.round(x.base * m));
}
function renderReview(sp, res){
  let html = '<button class="backlink" onclick="go(\'today\')">‹ Today</button>' +
    '<h1>'+esc(sp.name)+' · check the times</h1>' +
    '<div class="sub" style="margin-bottom:12px">Nothing is learned yet. Fix anything the timer got wrong, then confirm.</div><div class="card">';
  res.forEach(x=>{
    if (x.outcome !== "done"){
      html += '<div class="recap-row"><div class="recap-top"><span>'+esc(x.name)+'</span>' +
        '<span class="sub">'+(x.outcome==="skipped"?"skipped":"→ tomorrow")+'</span></div></div>';
      return;
    }
    const flagOpen = x.flag && !x.flagResolved;
    html += '<div class="recap-row'+(x.excluded?' excludedrow':'')+'">' +
      '<div class="recap-top"><span>'+esc(x.name)+'</span><span class="sub">planned '+x.est+'m</span></div>' +
      '<div class="row" style="margin:4px 0 2px">' +
        '<button class="mini" onclick="adjActual(\''+sp.id+'\',\''+x.id+'\',-1)">−</button>' +
        '<input class="valinput" style="width:66px;padding:6px 4px;font-size:15px" type="number" inputmode="decimal" step="0.5" min="0.5" value="'+x.edited+'" ' +
          'onchange="setActualInput(\''+sp.id+'\',\''+x.id+'\', this.value)"> <span class="sub">min</span>' +
        '<button class="mini" onclick="adjActual(\''+sp.id+'\',\''+x.id+'\',1)">+</button>' +
        '<span class="sub" style="flex:1;text-align:right">'+(x.excluded ? "won't affect estimates" : "next plan: ~"+prospectiveEst(x)+"m")+'</span></div>';
    if (flagOpen){
      html += '<div class="banner" style="background:var(--amber-soft);color:var(--amber);margin:8px 0">This took much longer than usual. Use this time, correct it, or exclude it?' +
        '<div class="bannerbtns">' +
        '<button class="btn small subtle" onclick="resolveFlag(\''+sp.id+'\',\''+x.id+'\',\'use\')">Use it</button>' +
        '<button class="btn small subtle" onclick="resolveFlag(\''+sp.id+'\',\''+x.id+'\',\'correct\')">Correct to planned</button>' +
        '<button class="btn small subtle" onclick="resolveFlag(\''+sp.id+'\',\''+x.id+'\',\'exclude\')">Exclude</button></div></div>';
    }
    html += '<button class="linkbtn" onclick="toggleExclude(\''+sp.id+'\',\''+x.id+'\')">'+
      (x.excluded ? "Include in learning" : "Don't use for learning")+'</button></div>';
  });
  html += '</div><button class="btn primary" onclick="confirmReview(\''+sp.id+'\')">Confirm · learn from tonight</button>' +
    '<button class="btn ghost" style="margin-top:10px" onclick="go(\'today\')">Back to Today · learning waits</button>';
  $("#app").innerHTML = html;
}
function adjActual(spId, taskId, d){
  const x = (state.results[spId]||[]).find(r=>r.id===taskId); if (!x) return;
  x.edited = Math.max(0.5, Math.round((x.edited + d) * 2) / 2);
  x.flagResolved = true; // adjusting is addressing it
  render();
}
function setActualInput(spId, taskId, v){
  const x = (state.results[spId]||[]).find(r=>r.id===taskId); if (!x) return;
  const n = parseFloat(v);
  if (!isNaN(n) && n > 0) x.edited = Math.max(0.5, Math.round(n * 2) / 2);
  x.flagResolved = true;
  render();
}
function toggleExclude(spId, taskId){
  const x = (state.results[spId]||[]).find(r=>r.id===taskId); if (!x) return;
  x.excluded = !x.excluded;
  if (x.excluded) x.flagResolved = true;
  render();
}
function resolveFlag(spId, taskId, action){
  const x = (state.results[spId]||[]).find(r=>r.id===taskId); if (!x) return;
  if (action === "correct") x.edited = x.est;
  if (action === "exclude") x.excluded = true;
  x.flagResolved = true;
  render();
  if (action === "correct") toast("Set to the planned time. Adjust further if needed.");
  if (action === "exclude") toast("Excluded. Tonight's time won't touch the estimate.");
}
function confirmReview(spId){
  const sp = state.sprints.find(s=>s.id===spId);
  (state.results[spId]||[]).forEach(x=>{
    if (x.outcome !== "done") return;
    x.actual = x.edited;
    if (!x.excluded){ const t = taskById(x.id); if (t) learn(t, x.edited); }
  });
  state.reviewed[spId] = true;
  render();
  toast("Learned from tonight. Estimates updated.");
}

/* =============== RECAP: LEARNED PHASE =============== */
function renderRecap(spId){
  const sp = state.sprints.find(s=>s.id===spId);
  const res = state.results[spId] || [];
  if (!state.reviewed[spId]){ renderReview(sp, res); return; }
  const done = res.filter(x=>x.outcome==="done");
  const totalAct = done.reduce((s,x)=>s+x.actual,0);
  const anySim = done.some(x=>x.simulated);
  const maxV = Math.max(1, ...res.map(x=>Math.max(x.est, x.actual||0)));

  let html = '<button class="backlink" onclick="go(\'today\')">‹ Today</button>' +
    '<h1>'+esc(sp.name)+' · recap</h1>' +
    '<div class="sub" style="margin-bottom:12px">'+done.length+' of '+res.length+' tasks done · ~'+Math.round(totalAct)+' min of doing' +
    (anySim ? ' · fast-tapped tasks use simulated times' : '')+'</div><div class="card">';

  res.forEach(x=>{
    let right, deltaHtml="";
    if (x.outcome!=="done"){ right = x.outcome==="skipped" ? "skipped" : "→ tomorrow"; }
    else {
      const diff = Math.round((x.actual - x.est));
      const cls = diff>1 ? "over" : (diff<-1 ? "under" : "on");
      const txt = diff>1 ? "+"+diff+" min" : (diff<-1 ? diff+" min" : "on time");
      deltaHtml = '<span class="delta '+cls+'">'+txt+'</span>' +
        (x.excluded ? ' <span class="sub muted" style="font-size:11px">excluded</span>' : '');
      right = "";
    }
    html += '<div class="recap-row"><div class="recap-top"><span>'+esc(x.name)+'</span>'+(deltaHtml||'<span class="sub">'+right+'</span>')+'</div>';
    if (x.outcome==="done"){
      const overr = x.actual > x.est*1.15 ? " overr" : "";
      html += '<div class="bars"><span>plan</span><div class="bar est"><i style="width:'+Math.round(x.est/maxV*100)+'%"></i></div><span>'+x.est+'m</span></div>' +
        '<div class="bars" style="margin-top:3px"><span>real</span><div class="bar act'+overr+'"><i style="width:'+Math.round(x.actual/maxV*100)+'%"></i></div><span>'+x.actual+'m</span></div>';
    }
    html += '</div>';
  });
  html += '</div>';

  // learning lines
  const lessons = [];
  done.forEach(x=>{
    if (x.excluded){ lessons.push("“"+x.name+"”: tonight's time was excluded. Estimate unchanged."); return; }
    const ratio = x.actual / x.base;
    if (ratio >= 1.25) lessons.push("“"+x.name+"” takes you about "+Math.round(x.actual)+" min, not "+x.base+". Future sessions will plan for that.");
    else if (ratio <= 0.75) lessons.push("“"+x.name+"” is faster than you think: ~"+Math.round(x.actual)+" min. It will fit into smaller gaps now.");
  });
  if (lessons.length){
    html += '<div class="learnbox"><div class="ttl">WHAT I LEARNED TONIGHT</div>' +
      lessons.map(l=>'<div class="ln">'+esc(l)+'</div>').join("") + '</div>';
  }
  html += '<div class="btnrow"><button class="btn ghost" onclick="go(\'today\')">Back to Today</button>' +
    '<button class="btn primary" onclick="replay(\''+spId+'\')">Replan with learned times</button></div>' +
    '<div class="sub muted" style="text-align:center;margin-top:10px">Replanning shows how tonight’s data changes tomorrow’s plan.</div>';
  $("#app").innerHTML = html;
}
function replay(spId){
  const sp = state.sprints.find(s=>s.id===spId);
  const prev = state.results[spId] || [];
  prev.forEach(x=>{ const t=taskById(x.id); if (t) t.doneToday = false; });
  sp.status = "idle";
  autofill(sp); // one tap: rebuild immediately with learned estimates
  const notes = [];
  prev.filter(r=>r.outcome==="done").forEach(r=>{
    const t = taskById(r.id); if (!t || t.autoCompanion) return;
    const ne = estOf(t);
    if (Math.abs(ne - r.est) >= 1) notes.push("“"+t.name+"”: "+r.est+"m → "+ne+"m, learned from last run.");
  });
  prev.forEach(r=>{
    const t = taskById(r.id);
    if (!t || t.autoCompanion || sp.picked.includes(r.id)) return;
    if (t.pile !== sp.homePile) notes.push("“"+t.name+"” was a one-night exception. It's back in its own pile.");
    else notes.push("“"+t.name+"” no longer fits at its real speed. Left in its pile.");
  });
  sp.picked.forEach(id=>{
    const t = taskById(id);
    if (t && !t.autoCompanion && !prev.some(r=>r.id===id))
      notes.push("“"+t.name+"” now fits. Added.");
  });
  notes.push(sp.buffer+" min kept for transitions, as always.");
  sp.changeNotes = notes; sp.changeTitle = null;
  go("fill", spId);
  toast("Rebuilt with your real speeds.");
}
